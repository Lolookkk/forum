name: CI Pipeline Forum Safe Space

# Se déclenche lors d'un push ou d'une PR sur la branche main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Récupère le code du dépôt
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. Installe Node.js
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # 3. Initialisation de la base de données PostgreSQL locale
      - name: Attendre que PostgreSQL soit prêt
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432; then
              echo "PostgreSQL est prêt !"
              break
            fi
            echo "Attente de PostgreSQL... ($i/30)"
            sleep 1
          done

      - name: Appliquer le schéma de la base de données
        run: |
          export PGPASSWORD=postgres
          psql -h localhost -p 5432 -U postgres -d forum_test -f backend/src/config/schema.sql

      - name: Insérer les données de test (seed)
        run: |
          export PGPASSWORD=postgres
          psql -h localhost -p 5432 -U postgres -d forum_test -f backend/src/config/seed.sql

      # --- BACKEND ---
      - name: Installation des dépendances Backend
        run: cd backend && npm install

      - name: Linter Backend
        run: cd backend && npm run lint --if-present

      - name: Tests unitaires Backend & Couverture
        run: cd backend && npm test -- --coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/forum_test
          NODE_ENV: test

      # --- FRONTEND ---
      - name: Installation des dépendances Frontend
        run: cd frontend && npm install

      - name: Linter Frontend
        run: cd frontend && npm run lint --if-present

      - name: Tests unitaires Frontend
        run: cd frontend && npm test